services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: session
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: plain
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - pgbouncer
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GENIUSPAY_API_KEY: ${GENIUSPAY_API_KEY}
      GENIUSPAY_API_SECRET: ${GENIUSPAY_API_SECRET}
      GENIUSPAY_WEBHOOK_SECRET: ${GENIUSPAY_WEBHOOK_SECRET:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # Plunk — notifications email
      PLUNK_SECRET_KEY: ${PLUNK_SECRET_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # Web Push — notifications navigateur
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@kamforms.com}
      UPLOAD_DIR: /app/uploads
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # Analytics — scripts (côté client, injectés par les layouts)
      NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${NEXT_PUBLIC_ANALYTICS_SCRIPT_URL:-}
      NEXT_PUBLIC_ANALYTICS_RECORDER_URL: ${NEXT_PUBLIC_ANALYTICS_RECORDER_URL:-}
      NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${NEXT_PUBLIC_ANALYTICS_WEBSITE_ID:-}
      # Analytics — API (côté serveur, lecture des stats)
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      # Admin interne - route cachee + allowlist email Clerk
      ADMIN_SECRET_PATH: ${ADMIN_SECRET_PATH:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
